<!DOCTYPE html>
<html lang="ar"> <!-- اللغة العربية -->

<head>
  
  <title> مشغل موسيقى</title>
  <link  href="images/photo_5805537385000322521_y.jpg" type="image\x-icon"rel="icon">
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مشغل موسيقي</title>
  <!-- خطوط جوجل -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <!-- ملف التنسيقات -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <div class="top-bar">
      <i class="material-icons">expand_more</i>
      <span> موسيقاي</span>
      <i class="material-icons">more_horiz</i>
    </div>

    <div class="img-area">
      <img src="images/5803285585186638110.jpg" alt="غلاف الأغنية" />
    </div>

    <div class="song-info" style="text-align: center; margin-top: 15px;">
      <p id="song-title" class="title" style="font-size: 24px; font-weight: bold; margin: 0;">
        DARKSIDE 
      </p>
      <p id="song-artist" class="artist" style="font-size: 14px; color: gray; margin: 5px 0 0;">
        Neoni
      </p>
    </div>

    <div class="progress-area">
      <div class="progress-bar">
        <audio id="main-audio" src="music/song3.mp3"></audio>
      </div>
      <div class="song-timer">
        <span class="current-time">00:00</span>
        <span class="max-duration">00:00</span>
      </div>
    </div>

    <div class="controls">
      <i id="repeat-plist" class="material-icons" title="تكرار القائمة">repeat</i>
      <i id="prev" class="material-icons">skip_previous</i>
      <div class="play-pause">
        <i class="material-icons play">play_arrow</i>
      </div>
      <i id="next" class="material-icons">skip_next</i>
      <i class="material-icons">queue_music</i>
    </div>
  </div>

  <script src="java/music-list.js"></script>
  <script src="java/main.js"></script>
</body>

</html>
